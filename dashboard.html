<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBox — My Notebooks</title>
    <meta name="description" content="Manage your DevBox notebooks and connect to cloud runtimes.">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: #fdf8f8; color: #1A1A1A; min-height: 100vh;
        }

        /* ── Top Nav ── */
        nav {
            background: #ffffff; border-bottom: 2px solid #1A1A1A;
            padding: 0 40px; display: flex; align-items: stretch;
            height: 56px; position: sticky; top: 0; z-index: 100;
        }
        .nav-logo {
            display: flex; align-items: center;
            font-family: 'Sora', sans-serif; font-size: 1.15rem; font-weight: 800;
            color: #1A1A1A; border-right: 2px solid #1A1A1A; padding-right: 24px; margin-right: 24px;
        }
        .nav-links { display: flex; align-items: stretch; }
        .nav-link {
            display: flex; align-items: center; padding: 0 16px;
            font-size: 0.82rem; font-weight: 600; color: #888;
            border-right: 1px solid #E5E1DA; text-decoration: none; transition: 0.15s;
        }
        .nav-link:hover { color: #1A1A1A; background: #f7f3f2; }
        .nav-link.active { color: #1A1A1A; border-bottom: 2px solid #1A1A1A; margin-bottom: -2px; }
        .nav-spacer { flex: 1; }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .user-badge {
            display: flex; align-items: center; gap: 8px;
            background: #f1edec; border: 1px solid #E5E1DA; border-radius: 6px;
            padding: 5px 12px 5px 8px;
        }
        .user-initial {
            width: 24px; height: 24px; border-radius: 4px; background: #1A1A1A;
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 800;
        }
        .user-name { font-size: 0.82rem; font-weight: 700; }
        .btn-signout {
            background: transparent; border: 1px solid #E5E1DA; padding: 6px 14px;
            border-radius: 6px; font-size: 0.78rem; font-weight: 600; color: #888;
            cursor: pointer; font-family: inherit; transition: 0.15s;
        }
        .btn-signout:hover { border-color: #1A1A1A; color: #1A1A1A; }

        /* ── Main ── */
        .main { max-width: 860px; margin: 0 auto; padding: 48px 32px; }

        /* Page Header */
        .page-hdr { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; }
        .page-title { font-family: 'Sora', sans-serif; font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; }
        .page-count { font-size: 0.82rem; color: #888; margin-top: 4px; font-weight: 500; }
        .btn-new {
            display: flex; align-items: center; gap: 6px;
            background: #1A1A1A; color: #fff; border: none; padding: 10px 20px;
            border-radius: 8px; font-size: 0.875rem; font-weight: 700; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: 0.2s; white-space: nowrap;
        }
        .btn-new:hover { background: #333; }
        .btn-new .material-symbols-outlined { font-size: 1rem; }

        /* Search */
        .search-wrap { position: relative; margin-bottom: 24px; }
        .search-wrap .material-symbols-outlined {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            font-size: 1rem; color: #aaa; pointer-events: none;
        }
        .search-input {
            width: 100%; padding: 10px 14px 10px 38px; border: 1.5px solid #E5E1DA;
            border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.875rem;
            outline: none; transition: 0.2s; background: #fff; color: #1A1A1A;
        }
        .search-input:focus { border-color: #1A1A1A; }

        /* Notebook List */
        .nb-list { display: flex; flex-direction: column; gap: 2px; }
        .nb-item {
            display: flex; align-items: center; gap: 16px; padding: 14px 18px;
            background: #ffffff; border: 1.5px solid #E5E1DA; border-radius: 10px;
            transition: 0.18s; cursor: pointer;
        }
        .nb-item:hover { border-color: #1A1A1A; box-shadow: 3px 3px 0 #1A1A1A; transform: translate(-1px,-1px); }
        .nb-icon-wrap {
            width: 38px; height: 38px; border-radius: 8px; background: #f1edec;
            border: 1.5px solid #E5E1DA; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 1.1rem;
        }
        .nb-info { flex: 1; min-width: 0; }
        .nb-name { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nb-meta { display: flex; gap: 14px; margin-top: 3px; }
        .nb-meta-item { font-size: 0.72rem; color: #aaa; display: flex; align-items: center; gap: 4px; }
        .nb-meta-item .material-symbols-outlined { font-size: 0.85rem; }
        .nb-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .btn-open {
            display: flex; align-items: center; gap: 4px;
            background: #1A1A1A; color: #fff; border: none; padding: 7px 14px;
            border-radius: 6px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
            font-family: 'Inter', sans-serif; text-decoration: none; transition: 0.15s; white-space: nowrap;
        }
        .btn-open:hover { background: #333; }
        .btn-delete {
            width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
            background: transparent; border: 1.5px solid #E5E1DA; border-radius: 6px;
            cursor: pointer; color: #dc2626; transition: 0.15s;
        }
        .btn-delete:hover { background: rgba(220,38,38,0.06); border-color: #dc2626; }
        .btn-delete .material-symbols-outlined { font-size: 0.95rem; }

        /* Empty State */
        .empty-state { text-align: center; padding: 80px 20px; }
        .empty-state .e-icon { font-size: 3rem; margin-bottom: 16px; }
        .empty-state h3 { font-family: 'Sora', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
        .empty-state p { font-size: 0.875rem; color: #888; margin-bottom: 20px; }

        /* Modal */
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 200; align-items: center; justify-content: center; }
        .modal-bg.open { display: flex; }
        .modal {
            background: #ffffff; border: 2px solid #1A1A1A; border-radius: 14px;
            padding: 32px; width: 100%; max-width: 420px;
            box-shadow: 8px 8px 0 #1A1A1A;
        }
        .modal h3 { font-family: 'Sora', sans-serif; font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
        .modal p { font-size: 0.82rem; color: #888; margin-bottom: 20px; }
        .modal input {
            width: 100%; padding: 10px 14px; border: 1.5px solid #E5E1DA;
            border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.875rem;
            outline: none; margin-bottom: 16px; transition: 0.2s;
        }
        .modal input:focus { border-color: #1A1A1A; }
        .modal-footer { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-cancel {
            padding: 9px 18px; background: #f1edec; border: 1.5px solid #E5E1DA;
            border-radius: 7px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .btn-cancel:hover { border-color: #1A1A1A; }
        .btn-create {
            padding: 9px 18px; background: #1A1A1A; color: #fff;
            border: none; border-radius: 7px; font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: inherit;
        }
        .btn-create:hover { background: #333; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .nb-item { animation: fadeSlide 0.25s ease both; }

        @media (max-width: 640px) {
            nav { padding: 0 16px; }
            .main { padding: 28px 16px; }
            .nb-item { flex-wrap: wrap; }
            .nb-actions { width: 100%; }
            .btn-open { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">DevBox</div>
        <div class="nav-links">
            <a class="nav-link active" href="dashboard.html">Notebooks</a>
            <a class="nav-link" href="plans.html">Plans</a>
        </div>
        <div class="nav-spacer"></div>
        <div class="nav-right">
            <div class="user-badge">
                <div class="user-initial" id="user-initial">?</div>
                <div class="user-name" id="auth-status">Loading...</div>
            </div>
            <button class="btn-signout" onclick="logout()">Sign out</button>
        </div>
    </nav>

    <div class="main">
        <div class="page-hdr">
            <div>
                <div class="page-title">My Notebooks</div>
                <div class="page-count" id="nb-count">Loading...</div>
            </div>
            <button class="btn-new" onclick="openCreateModal()">
                <span class="material-symbols-outlined">add</span> New Notebook
            </button>
        </div>

        <div class="search-wrap">
            <span class="material-symbols-outlined">search</span>
            <input type="text" class="search-input" id="search-input" placeholder="Search notebooks..." oninput="filterNotebooks()">
        </div>

        <div class="nb-list" id="list"></div>
    </div>

    <!-- Create Modal -->
    <div class="modal-bg" id="create-modal" onclick="handleModalClick(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h3>New Notebook</h3>
            <p>Give your notebook a descriptive name.</p>
            <input type="text" id="nb-name-input" placeholder="e.g. Data Analysis 2026" onkeydown="if(event.key==='Enter') confirmCreate()">
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
                <button class="btn-create" onclick="confirmCreate()">Create →</button>
            </div>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('username');
        if (!username) { window.location.href = 'devbox_login.html'; }

        let allNotebooks = [];

        document.getElementById('auth-status').innerText = username;
        document.getElementById('user-initial').innerText = username.charAt(0).toUpperCase();

        function logout() { localStorage.removeItem('username'); localStorage.removeItem('devbox_session'); window.location.href = 'devbox_login.html'; }

        function loadNotebooks() {
            allNotebooks = JSON.parse(localStorage.getItem('notebooks') || '[]');
            allNotebooks.sort((a, b) => b.updatedAt - a.updatedAt);
            renderNotebooks(allNotebooks);
        }

        function filterNotebooks() {
            const q = document.getElementById('search-input').value.toLowerCase();
            renderNotebooks(q ? allNotebooks.filter(nb => nb.name.toLowerCase().includes(q)) : allNotebooks);
        }

        function renderNotebooks(notebooks) {
            const list = document.getElementById('list');
            list.innerHTML = '';
            document.getElementById('nb-count').innerText = `${notebooks.length} notebook${notebooks.length !== 1 ? 's' : ''}`;

            if (notebooks.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="e-icon">📓</div>
                        <h3>No notebooks yet</h3>
                        <p>Create your first notebook to start running code in the cloud.</p>
                        <button class="btn-new" onclick="openCreateModal()"><span class="material-symbols-outlined">add</span> Create your first notebook</button>
                    </div>`;
                return;
            }

            notebooks.forEach((nb, i) => {
                const item = document.createElement('div');
                item.className = 'nb-item';
                item.style.animationDelay = `${i * 0.04}s`;
                const date = new Date(nb.updatedAt);
                const cellCount = (nb.cells || []).length;
                item.innerHTML = `
                    <div class="nb-icon-wrap">📓</div>
                    <div class="nb-info">
                        <div class="nb-name">${escapeHtml(nb.name)}</div>
                        <div class="nb-meta">
                            <span class="nb-meta-item"><span class="material-symbols-outlined">schedule</span> ${getTimeAgo(date)}</span>
                            <span class="nb-meta-item"><span class="material-symbols-outlined">table_rows</span> ${cellCount} cell${cellCount !== 1 ? 's' : ''}</span>
                        </div>
                    </div>
                    <div class="nb-actions">
                        <a href="ide.html?id=${nb.id}" class="btn-open">Open <span class="material-symbols-outlined" style="font-size:0.9rem;">arrow_forward</span></a>
                        <button class="btn-delete" onclick="deleteNotebook('${nb.id}')"><span class="material-symbols-outlined">delete</span></button>
                    </div>`;
                list.appendChild(item);
            });
        }

        function openCreateModal() {
            document.getElementById('create-modal').classList.add('open');
            setTimeout(() => document.getElementById('nb-name-input').focus(), 80);
        }
        function closeCreateModal() {
            document.getElementById('create-modal').classList.remove('open');
            document.getElementById('nb-name-input').value = '';
        }
        function handleModalClick(e) { if (e.target === document.getElementById('create-modal')) closeCreateModal(); }

        function confirmCreate() {
            const name = document.getElementById('nb-name-input').value.trim();
            if (!name) { document.getElementById('nb-name-input').focus(); return; }
            const notebooks = JSON.parse(localStorage.getItem('notebooks') || '[]');
            const id = 'nb_' + Date.now();
            notebooks.push({ id, name, cells: [], updatedAt: Date.now() });
            localStorage.setItem('notebooks', JSON.stringify(notebooks));
            closeCreateModal();
            setTimeout(() => window.location.href = `ide.html?id=${id}`, 80);
        }

        function deleteNotebook(id) {
            if (!confirm('Delete this notebook? This cannot be undone.')) return;
            let notebooks = JSON.parse(localStorage.getItem('notebooks') || '[]');
            notebooks = notebooks.filter(nb => nb.id !== id);
            localStorage.setItem('notebooks', JSON.stringify(notebooks));
            loadNotebooks();
        }

        function escapeHtml(str) { return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function getTimeAgo(date) {
            const secs = Math.floor((Date.now() - date.getTime()) / 1000);
            if (secs < 60) return 'just now';
            if (secs < 3600) return `${Math.floor(secs/60)}m ago`;
            if (secs < 86400) return `${Math.floor(secs/3600)}h ago`;
            if (secs < 604800) return `${Math.floor(secs/86400)}d ago`;
            return date.toLocaleDateString();
        }

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); openCreateModal(); }
            if (e.key === 'Escape') closeCreateModal();
        });

        loadNotebooks();
    </script>
</body>
</html>
