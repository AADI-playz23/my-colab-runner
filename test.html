<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absora DevBox - System Connection Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fdf8f8; color: #1A1A1A; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 14px; border: 1px solid #E5E1DA; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04); }
        h1 { font-family: 'Sora', sans-serif; margin-top: 0; color: #1A1A1A; border-bottom: 1px solid #E5E1DA; padding-bottom: 15px; }
        .check-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #E5E1DA; }
        .check-item:last-child { border-bottom: none; }
        .check-name { font-weight: bold; font-size: 18px; }
        .check-status { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .btn { padding: 10px 20px; background: #1A1A1A; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; font-family: 'Inter', sans-serif; font-weight: 600; }
        .btn:hover { background: #5f5e5e; }
        
        .status-loading { color: #d97706; }
        .status-success { color: #16a34a; }
        .status-error { color: #dc2626; }
        .error-msg { font-size: 12px; font-weight: normal; max-width: 300px; text-align: right; color: #444748; }
    </style>
</head>
<body>

<div class="container">
    <h1>System Connection Tester</h1>
    <p>Run this tool to verify that all your Vercel Environment Variables and APIs are correctly configured.</p>
    
    <div class="check-item">
        <div class="check-name">1. PostgreSQL Database Connection</div>
        <div class="check-status" id="status-db">Not Tested</div>
    </div>
    
    <div class="check-item">
        <div class="check-name">2. Upstash Redis (Vercel KV) Connection</div>
        <div class="check-status" id="status-kv">Not Tested</div>
    </div>
    
    <div class="check-item">
        <div class="check-name">3. GitHub API Connection (GITHUB_TOKEN)</div>
        <div class="check-status" id="status-github">Not Tested</div>
    </div>

    <button class="btn" onclick="runTests()">Run All Connection Tests</button>
</div>

<script>
    async function testEndpoint(endpoint, elementId) {
        const el = document.getElementById(elementId);
        el.innerHTML = '<span class="status-loading">Testing...</span>';
        try {
            const res = await fetch(endpoint);
            const data = await res.json();
            if (res.ok && data.status === 'success') {
                el.innerHTML = `<span class="status-success">✅ Passed</span>`;
            } else {
                el.innerHTML = `<span class="status-error">❌ Failed</span><br><span class="error-msg">${data.message || 'Unknown error'}</span>`;
            }
        } catch (e) {
            el.innerHTML = `<span class="status-error">❌ Failed</span><br><span class="error-msg">${e.message}</span>`;
        }
    }

    async function runTests() {
        testEndpoint('/api/test_connections?type=db', 'status-db');
        testEndpoint('/api/test_connections?type=kv', 'status-kv');
        testEndpoint('/api/test_connections?type=github', 'status-github');
    }
</script>

</body>
</html>
